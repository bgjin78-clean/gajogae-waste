<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>페이지를 찾을 수 없습니다 | 가족애 폐기물처리</title>
  <meta name="description" content="요청하신 페이지를 찾을 수 없습니다. 가족애 폐기물처리 메인페이지 또는 지역별 폐기물처리 안내 페이지를 이용해주세요." />

  <link rel="stylesheet" href="/style.css" />

  <style>
    .error-page {
      min-height: 100vh;
      background:
        linear-gradient(rgba(42, 32, 24, 0.72), rgba(42, 32, 24, 0.72)),
        url("/main-bg.jpg") center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      color: #fff;
    }

    .error-box {
      max-width: 760px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.28);
      border-radius: 26px;
      padding: 54px 34px;
      backdrop-filter: blur(8px);
    }

    .error-code {
      font-size: 82px;
      font-weight: 900;
      margin-bottom: 10px;
      color: #f2d4ad;
    }

    .error-box h1 {
      font-size: 34px;
      margin-bottom: 18px;
    }

    .error-box p {
      font-size: 18px;
      color: #f5eadc;
      margin-bottom: 30px;
    }

    .error-actions {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .error-actions a {
      display: inline-block;
      background: #8b5e34;
      color: #fff;
      padding: 14px 24px;
      border-radius: 12px;
      font-weight: 800;
    }

    .error-actions a.secondary {
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.4);
    }

    @media (max-width: 560px) {
      .error-code {
        font-size: 62px;
      }

      .error-box h1 {
        font-size: 26px;
      }

      .error-actions a {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <section class="error-page">
    <div class="error-box">
      <div class="error-code">404</div>
      <h1>페이지를 찾을 수 없습니다</h1>
      <p>
        주소가 변경되었거나 존재하지 않는 페이지입니다.<br>
        메인페이지 또는 지역별 폐기물처리 안내 페이지로 이동해 주세요.
      </p>

      <div class="error-actions">
        <a href="/">메인페이지로 이동</a>
        <a href="/#region" class="secondary">지역별 안내 보기</a>
        <a href="tel:010-5836-3895" class="secondary">전화 상담하기</a>
      </div>
    </div>
  </section>
</body>
</html>
